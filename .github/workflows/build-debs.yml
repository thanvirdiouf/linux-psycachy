# SPDX-License-Identifier: GPL-2.0-only
name: Build Debian kernel packages

on:
  workflow_call:
    inputs:
      kernel_version:
        required: true
        type: string
      source_ref:
        description: Exact source commit to build
        required: true
        type: string
      publish_release:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      kernel_version:
        description: Pinned kernel version (blank uses src/default-version)
        required: false
        type: string
      publish_release:
        description: Publish a GitHub Release after a successful build
        required: true
        default: false
        type: boolean
  push:
    branches: [master, main]
    paths:
      - build.sh
      - src/config
      - src/releases.tsv
      - src/default-version
      - src/llvm-version
      - src/nvidia-validation.json
      - packaging/**
      - src/patches/**
      - tests/**
      - scripts/**
      - .github/workflows/build-debs.yml
  pull_request:
    paths:
      - build.sh
      - src/config
      - src/releases.tsv
      - src/default-version
      - src/llvm-version
      - src/nvidia-validation.json
      - packaging/**
      - src/patches/**
      - tests/**
      - scripts/**
      - .github/workflows/build-debs.yml

permissions:
  contents: read

concurrency:
  group: kernel-debs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_COMMIT: ${{ inputs.source_ref || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  TOOLCHAIN: clang-thinlto

jobs:
  validate:
    name: Validate builder
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      kernel-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Select the kernel version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.kernel_version }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ -z $version ]]; then
            version=$(<src/default-version)
          fi
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid kernel version: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check shell syntax and run regression tests
        shell: bash
        run: |
          for script in build.sh scripts/psycachy-ld scripts/install-packages.sh packaging/nvidia/*.sh packaging/nvidia/preinst packaging/nvidia/postinst packaging/nvidia/build; do
            bash -n "$script"
          done
          python3 -m unittest discover -s tests -v

  build:
    name: Build amd64 Debian packages
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      KERNEL_VERSION: ${{ needs.validate.outputs.kernel-version }}
      BUILD_CACHE: '1'
      MODULE_LINK_JOBS: '1'
      KBUILD_BUILD_USER: github-actions
      KBUILD_BUILD_HOST: github-runner
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Free space for kernel compilation
        run: |
          # These SDKs are preinstalled on this disposable runner, but unused here.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          if command -v docker >/dev/null; then
            sudo docker image prune --all --force
          fi
          df -h .

      - name: Set reproducible build identity
        run: |
          printf 'KBUILD_BUILD_TIMESTAMP=%s\n' "$(git show -s --format=%cD HEAD)" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          printf 'LLVM_VERSION=%s\n' "$(<src/llvm-version)" >> "$GITHUB_ENV"

      - name: Prepare sources and install build dependencies
        env:
          BUILD_CACHE: '0'
        run: |
          ./build.sh "$KERNEL_VERSION" --prepare-only 2>&1 | tee build.log

      - name: Install compiler cache and identify cache compatibility
        id: cache-settings
        run: |
          sudo apt-get install -y ccache
          fingerprint=$(
            {
              sha256sum "$(command -v "clang-$LLVM_VERSION")" "$(command -v "ld.lld-$LLVM_VERSION")"
              ccache --version
            } | sha256sum | cut -d ' ' -f1
          )
          printf 'prefix=%s-%s-llvm%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$LLVM_VERSION" "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore compiler and ThinLTO caches
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/ccache
            .cache/thinlto
          key: kernel-cache-v1-${{ steps.cache-settings.outputs.prefix }}-${{ env.KERNEL_VERSION }}-${{ env.BUILD_COMMIT }}
          restore-keys: |
            kernel-cache-v1-${{ steps.cache-settings.outputs.prefix }}-

      - name: Configure a build without debug information
        run: |
          # Full DWARF plus debug .debs can exhaust a hosted runner's disk.
          # Keep generic hardware support, BORE, BBR3, ADIOS, and module versioning.
          "src/build-$KERNEL_VERSION-clang-thinlto/scripts/config" --file src/config \
            --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            --disable DEBUG_INFO_DWARF4 --disable DEBUG_INFO_DWARF5 \
            --enable DEBUG_INFO_NONE \
            --disable DEBUG_INFO_BTF --disable DEBUG_INFO_BTF_MODULES \
            --disable SCHED_CLASS_EXT --disable GDB_SCRIPTS \
            --disable GENDWARFKSYMS --enable GENKSYMS

      - name: Compile and package the kernel
        run: |
          export JOBS="$(nproc)"
          export KERNEL_LINK_JOBS="$JOBS"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache"
          ccache --zero-stats
          python3 scripts/measure_build.py --output diagnostics/kernel -- \
            ./build.sh "$KERNEL_VERSION" 2>&1 | tee -a build.log

      - name: Report resource usage and compiler cache statistics
        if: always()
        run: |
          if [[ -f diagnostics/kernel/summary.md ]]; then
            cat diagnostics/kernel/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if command -v ccache >/dev/null; then
            mkdir -p diagnostics
            CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache" ccache --show-stats --verbose | tee diagnostics/ccache.txt
            printf '\n### Compiler cache\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            cat diagnostics/ccache.txt >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify and collect Debian packages
        run: |
          shopt -s nullglob
          packages=(src/*.deb)
          for prefix in linux-image linux-headers linux-libc-dev psycachy-nvidia-support; do
            matches=(src/"$prefix"*.deb)
            if [[ ${#matches[@]} -eq 0 ]]; then
              echo "Missing expected package: $prefix" >&2
              exit 1
            fi
          done
          mkdir -p dist
          for package in "${packages[@]}"; do
            dpkg-deb --info "$package"
            test "$(dpkg-deb --field "$package" Architecture)" = amd64
            cp "$package" dist/
          done
          metadata=(src/*.buildinfo src/*.changes)
          if [[ ${#metadata[@]} -gt 0 ]]; then
            cp "${metadata[@]}" dist/
          fi
          cp "src/build-$KERNEL_VERSION-clang-thinlto/.config" dist/kernel.config
          cp "src/build-$KERNEL_VERSION-clang-thinlto/TOOLCHAIN.txt" dist/TOOLCHAIN.txt
          cp "src/build-$KERNEL_VERSION-clang-thinlto/BUILD-TUNING.txt" dist/BUILD-TUNING.txt
          cp src/install-packages.sh dist/install-packages.sh
          python3 - "$KERNEL_VERSION" <<'PY'
          import json, pathlib, shutil, sys
          from scripts import patchsets
          folder, metadata = patchsets.load(pathlib.Path.cwd(), sys.argv[1])
          if metadata:
              shutil.copyfile(folder / 'patchset.json', 'dist/PATCHES.json')
          PY
          printf 'Kernel: %s\nCommit: %s\nRun: %s\n' \
            "$KERNEL_VERSION" "$BUILD_COMMIT" "$GITHUB_RUN_ID" > dist/BUILD.txt
          (cd dist && sha256sum ./*.deb install-packages.sh > SHA256SUMS)

      - name: Compile pinned NVIDIA modules against packaged headers
        run: |
          python3 scripts/validate_nvidia.py --packages dist
          cat dist/NVIDIA-VALIDATION.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiler and ThinLTO caches
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/ccache
            .cache/thinlto
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload Debian packages
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: psycachy-${{ env.KERNEL_VERSION }}-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: psycachy-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            diagnostics/
            dist/nvidia-build.log
            dist/NVIDIA-VALIDATION.txt
            src/build-${{ env.KERNEL_VERSION }}-clang-thinlto/.config
            src/build-${{ env.KERNEL_VERSION }}-clang-thinlto/TOOLCHAIN.txt
            src/build-${{ env.KERNEL_VERSION }}-clang-thinlto/BUILD-TUNING.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KERNEL_VERSION: ${{ needs.validate.outputs.kernel-version }}
    permissions:
      contents: write
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Verify release packages
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          test -s kernel.config
          test -s BUILD.txt
          test -s TOOLCHAIN.txt
          test -s NVIDIA-VALIDATION.txt
          test -s install-packages.sh
          shopt -s nullglob
          for prefix in linux-image linux-headers linux-libc-dev psycachy-nvidia-support; do
            packages=("$prefix"*.deb)
            if [[ ${#packages[@]} -eq 0 ]]; then
              echo "Missing release package: $prefix" >&2
              exit 1
            fi
          done

      - name: Publish packages and release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PSYCACHY_RELEASE_TOKEN }}
        run: |
          tag="psycachy-$KERNEL_VERSION-build-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          PsyCachy Linux $KERNEL_VERSION for generic x86-64 Debian/Ubuntu systems.

          Built with Clang/LLVM and ThinLTO, BORE, BBR3, and ADIOS.
          Compiler versions are recorded in TOOLCHAIN.txt. CI builds omit debug information,
          BTF, and sched_ext. The resolved configuration is attached as kernel.config.

          Download the packages, install-packages.sh, and SHA256SUMS into one directory.
          Verify with: sha256sum --check SHA256SUMS
          Install with: bash install-packages.sh
          NVIDIA users with a distribution NVIDIA DKMS driver: bash install-packages.sh --nvidia
          The optional support package selects the matching LLVM tools before kernel installation.
          NVIDIA-VALIDATION.txt records the pinned open driver compilation test; GPU boot/load
          compatibility and Secure Boot trust still require testing on the user's system.

          Source commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$BUILD_COMMIT
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$BUILD_COMMIT" \
            --title "PsyCachy $KERNEL_VERSION (build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT)" \
            --notes-file "$notes"
          printf 'Published [%s](%s/%s/releases/tag/%s)\n' \
            "$tag" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
